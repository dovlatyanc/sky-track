services:
  postgres:
    image: postgres:15-alpine
    container_name: skytracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skytracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skytracker-network

  backend:
    build: ./backend
    container_name: skytracker-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/skytracker
      JWT_SECRET: mysecretkey123
      PORT: 5174
      NODE_OPTIONS: --max-old-space-size=2048
    ports:
      - "5174:5174"
    depends_on:
      - postgres
    networks:
      - skytracker-network

  frontend:
    image: nginx:alpine
    container_name: skytracker-frontend
    volumes:
      - ./dist:/usr/share/nginx/html
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - skytracker-network

volumes:
  postgres_data:

networks:
  skytracker-network:
    driver: bridge